# hydra.job.chdir: false
hydra:
  searchpath:
    # 绝对路径由 train.py 根据 __file__ 写入 OMNI_DRONES_HYDRA_SEARCHPATH（避免从仓库根目录运行时 ../cfg 解析错误）
    - file://${oc.env:OMNI_DRONES_HYDRA_SEARCHPATH}

headless: true

sim: ${task.sim}
env: ${task.env}

# total_frames: 150_000_000
total_frames: 30000000
max_iters: -1
eval_interval: -1
save_interval: 200
seed: 0

viewer:
  resolution: [960, 720]
  eye: [8, 0., 6.]
  lookat: [0., 0., 1.]

wandb:
  group: ${oc.select:..task.name}
  run_name: ${oc.select:..task.name,test}-${oc.select:..algo.name,none}
  job_type: train
  entity:
  project: omnidrones
  mode: online # set to 'disabled' when debugging locally
  run_id:
  monitor_gym: True
  tags:

defaults:
  - task: Hover
  - algo: ppo
  - _self_
